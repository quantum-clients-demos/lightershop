services:
  db:
    image: postgres:16-alpine
    container_name: ember_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lightershop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lightershop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ember_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lightershop}
      - SECRET_KEY=${SECRET_KEY:-ember-and-co-ultra-secure-demo-secret-key-2026}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_EMBER_DEMO_KEY}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-ember_demo_secret_key_12345}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: ember_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
